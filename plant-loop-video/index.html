<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070907; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #070907; }
    .scene { position: absolute; inset: 0; overflow: hidden; }
    .source, .moving-canopy { position: absolute; inset: -10px; width: 1940px; height: 1100px; object-fit: cover; }
    .source { z-index: 1; }
    .moving-canopy {
      z-index: 2;
      filter: url(#breeze);
      -webkit-mask-image: linear-gradient(to bottom, transparent 19%, rgba(0,0,0,.18) 29%, #000 43%, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 19%, rgba(0,0,0,.18) 29%, #000 43%, #000 100%);
      transform-origin: 50% 100%;
      will-change: transform, filter;
      background: url("indoor-hemp.png") center / cover no-repeat;
    }
    .leaf-cluster {
      position: absolute;
      z-index: 3;
      inset: -10px;
      width: 1940px;
      height: 1100px;
      background: url("indoor-hemp.png") center / cover no-repeat;
      transform-origin: 50% 100%;
      will-change: transform;
    }
    .c1 { mask-image: radial-gradient(ellipse 12% 34% at 9% 62%, #000 35%, transparent 75%); transform-origin: 9% 91%; }
    .c2 { mask-image: radial-gradient(ellipse 12% 38% at 24% 56%, #000 34%, transparent 74%); transform-origin: 24% 91%; }
    .c3 { mask-image: radial-gradient(ellipse 11% 35% at 39% 57%, #000 34%, transparent 74%); transform-origin: 39% 92%; }
    .c4 { mask-image: radial-gradient(ellipse 11% 34% at 53% 54%, #000 34%, transparent 74%); transform-origin: 53% 91%; }
    .c5 { mask-image: radial-gradient(ellipse 13% 41% at 69% 51%, #000 34%, transparent 74%); transform-origin: 69% 91%; }
    .c6 { mask-image: radial-gradient(ellipse 12% 37% at 84% 59%, #000 34%, transparent 74%); transform-origin: 84% 92%; }
    .c7 { mask-image: radial-gradient(ellipse 11% 35% at 96% 57%, #000 34%, transparent 74%); transform-origin: 96% 91%; }
    .c8 { mask-image: radial-gradient(ellipse 7% 25% at 17% 72%, #000 32%, transparent 72%); transform-origin: 17% 95%; }
    .c9 { mask-image: radial-gradient(ellipse 7% 27% at 32% 69%, #000 32%, transparent 72%); transform-origin: 32% 95%; }
    .c10 { mask-image: radial-gradient(ellipse 7% 26% at 46% 70%, #000 32%, transparent 72%); transform-origin: 46% 95%; }
    .c11 { mask-image: radial-gradient(ellipse 7% 28% at 61% 68%, #000 32%, transparent 72%); transform-origin: 61% 95%; }
    .c12 { mask-image: radial-gradient(ellipse 7% 25% at 77% 72%, #000 32%, transparent 72%); transform-origin: 77% 95%; }
    .c13 { mask-image: radial-gradient(ellipse 6% 24% at 90% 70%, #000 32%, transparent 72%); transform-origin: 90% 95%; }
    .c14 { mask-image: radial-gradient(ellipse 8% 24% at 50% 82%, #000 32%, transparent 72%); transform-origin: 50% 98%; }
    svg.filter-defs { position: absolute; width: 0; height: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div id="scene" class="clip scene" data-start="0" data-duration="6" data-track-index="0" data-layout-allow-overflow>
      <img class="source" src="indoor-hemp.png" alt="">
      <div id="canopy" class="moving-canopy" aria-hidden="true"></div>
      <div id="cluster1" class="leaf-cluster c1" aria-hidden="true"></div>
      <div id="cluster2" class="leaf-cluster c2" aria-hidden="true"></div>
      <div id="cluster3" class="leaf-cluster c3" aria-hidden="true"></div>
      <div id="cluster4" class="leaf-cluster c4" aria-hidden="true"></div>
      <div id="cluster5" class="leaf-cluster c5" aria-hidden="true"></div>
      <div id="cluster6" class="leaf-cluster c6" aria-hidden="true"></div>
      <div id="cluster7" class="leaf-cluster c7" aria-hidden="true"></div>
      <div id="cluster8" class="leaf-cluster c8" aria-hidden="true"></div>
      <div id="cluster9" class="leaf-cluster c9" aria-hidden="true"></div>
      <div id="cluster10" class="leaf-cluster c10" aria-hidden="true"></div>
      <div id="cluster11" class="leaf-cluster c11" aria-hidden="true"></div>
      <div id="cluster12" class="leaf-cluster c12" aria-hidden="true"></div>
      <div id="cluster13" class="leaf-cluster c13" aria-hidden="true"></div>
      <div id="cluster14" class="leaf-cluster c14" aria-hidden="true"></div>
    </div>
    <svg class="filter-defs" aria-hidden="true">
      <filter id="breeze" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
        <feTurbulence id="windNoise" type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="17" result="noise"/>
        <feDisplacementMap id="windMap" in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to("#windNoise", { attr: { baseFrequency: "0.009 0.023" }, duration: 3, ease: "sine.inOut" }, 0)
      .to("#windMap", { attr: { scale: 5.5 }, duration: 3, ease: "sine.inOut" }, 0)
      .to("#canopy", { x: 0.8, skewX: 0.035, duration: 3, ease: "sine.inOut" }, 0)
      .to("#cluster1", { x: 4.2, y: -0.6, rotation: 0.2, duration: 2.8, ease: "sine.inOut" }, 0.05)
      .to("#cluster2", { x: -3.2, y: 0.4, rotation: -0.15, duration: 2.55, ease: "sine.inOut" }, 0.2)
      .to("#cluster3", { x: 4.8, y: -0.5, rotation: 0.22, duration: 2.9, ease: "sine.inOut" }, 0)
      .to("#cluster4", { x: -2.8, y: 0.35, rotation: -0.13, duration: 2.4, ease: "sine.inOut" }, 0.35)
      .to("#cluster5", { x: 5.2, y: -0.7, rotation: 0.24, duration: 3, ease: "sine.inOut" }, 0)
      .to("#cluster6", { x: -3.8, y: 0.5, rotation: -0.17, duration: 2.6, ease: "sine.inOut" }, 0.25)
      .to("#cluster7", { x: 3.5, y: -0.4, rotation: 0.17, duration: 2.75, ease: "sine.inOut" }, 0.1)
      .to("#cluster8", { x: -3.1, y: 0.25, rotation: -0.14, duration: 2.35, ease: "sine.inOut" }, 0.4)
      .to("#cluster9", { x: 3.7, y: -0.35, rotation: 0.17, duration: 2.7, ease: "sine.inOut" }, 0.15)
      .to("#cluster10", { x: -2.9, y: 0.3, rotation: -0.13, duration: 2.45, ease: "sine.inOut" }, 0.35)
      .to("#cluster11", { x: 3.9, y: -0.4, rotation: 0.18, duration: 2.8, ease: "sine.inOut" }, 0.1)
      .to("#cluster12", { x: -3.3, y: 0.3, rotation: -0.15, duration: 2.5, ease: "sine.inOut" }, 0.3)
      .to("#cluster13", { x: 3.4, y: -0.3, rotation: 0.16, duration: 2.65, ease: "sine.inOut" }, 0.2)
      .to("#cluster14", { x: -2.2, y: 0.2, rotation: -0.1, duration: 2.3, ease: "sine.inOut" }, 0.5)
      .to("#windNoise", { attr: { baseFrequency: "0.006 0.018" }, duration: 3, ease: "sine.inOut" }, 3)
      .to("#windMap", { attr: { scale: 3 }, duration: 3, ease: "sine.inOut" }, 3)
      .to("#canopy", { x: 0, skewX: 0, duration: 3, ease: "sine.inOut" }, 3)
      .to(".leaf-cluster", { x: 0, y: 0, rotation: 0, duration: 3, ease: "sine.inOut" }, 3);
    window.__timelines.main = tl;
  </script>
</body>
</html>
